name: Publicar en GitHub Pages

# Publica la carpeta docs/ (página de transparencia ya construida y commiteada).
#   - push a main que cambie docs/: se publica automáticamente.
#   - workflow nocturno: lo invoca al terminar si hubo cambios (los push hechos con el GITHUB_TOKEN del propio
#     workflow no disparan otros workflows, por eso no basta con el disparador de push).
#   - a mano desde la pestaña Actions.
# Requiere Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar docs/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # La rama por nombre (no el SHA del evento): al llamarlo desde el nocturno incluye el commit recién subido
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Comprobar que docs/index.html existe
        run: test -s docs/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
