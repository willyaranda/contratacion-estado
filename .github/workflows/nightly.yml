name: Actualización nocturna

# Cada noche: descarga los anuncios nuevos del Ayuntamiento de Aranda de Duero, reconstruye la página de
# transparencia y sube todo en un único commit automático (dump/ + docs/).
# Si la página ha cambiado, se publica en GitHub Pages llamando a pages.yml (ver ese fichero).
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
# Si la descarga o el push fallan se reintenta en silencio (3 intentos en total, con espera creciente), sin avisos
# por email del fallo ni de los reintentos; si fallan todos, el job falla como siempre. Los reintentos no duplican
# el correo resumen: ver DIGEST_SENT_FILE más abajo.
on:
  schedule:
    # GitHub no garantiza los disparos programados (pueden retrasarse o saltarse): hay varios al día. Los que no
    # encuentran novedades son inocuos (sin novedades, no hay commit ni despliegue).
    - cron: '17 2 * * *' # 02:17 UTC (04:17 en horario de verano de España)
    - cron: '43 5 * * *' # 05:43 UTC (07:43 en horario de verano de España)
    - cron: '17 14 * * *' # 14:17 UTC (16:17 en horario de verano de España)
    - cron: '17 15 * * *' # 15:17 UTC (17:17 en horario de verano de España)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    name: Descargar, construir y subir
    runs-on: ubuntu-latest
    # peor caso: 3 intentos de descarga de 30 min (timeout) + esperas de 1 y 2 min, más build y push
    timeout-minutes: 110
    permissions:
      contents: write
    outputs:
      # 'true' si el commit de esta ejecución cambió la página (docs/)
      pages_changed: ${{ steps.commit.outputs.pages_changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Descarga y, si hay anuncios nuevos, manda UN correo resumen a NOTIFY_TO (en CCO).
      # La configuración llega solo a este paso. Las credenciales de AWS vienen de secrets del repositorio
      # (Settings > Secrets and variables > Actions): GitHub oculta sus valores en los logs y el código nunca los
      # imprime. Los destinatarios (NOTIFY_TO) no son secretos: es una variable del repositorio.
      # Si NOTIFY_TO está vacía o mal formada, o faltan las credenciales, el job falla antes de descargar nada.
      # Reintentos: cada intento parte del dump/ del último commit (git checkout + clean), porque una descarga a medias
      # deja ficheros nuevos sin punto de control y el reintento los vería como "ya existentes" (no los avisaría ni
      # seguiría más atrás en el feed). El job escribe el marcador DIGEST_SENT_FILE (fuera del repo) justo tras enviar
      # el correo; si existe, un reintento descarga igual pero no vuelve a enviar. El marcador no contiene datos.
      - name: Descargar anuncios nuevos y avisar por email
        run: |
          export DIGEST_SENT_FILE="$RUNNER_TEMP/digest-sent"
          rm -f "$DIGEST_SENT_FILE"
          max=3
          for attempt in $(seq 1 "$max"); do
            if [ "$attempt" -gt 1 ]; then
              echo "Intento ${attempt} de ${max} tras un fallo; no se enviará correo si ya se envió."
              git checkout -- dump
              git clean -fdq -- dump
            fi
            if timeout 30m npm run fetch; then
              exit 0
            fi
            echo "Intento ${attempt} de ${max} fallido."
            if [ "$attempt" -lt "$max" ]; then
              sleep $((attempt * ${RETRY_BASE_SECONDS:-60}))
            fi
          done
          echo "La descarga falló en los ${max} intentos."
          exit 1
        env:
          SEND_EMAILS: '1'
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # opcionales (Settings > Secrets and variables > Actions > Variables); sin ellas se usan los valores por defecto
          AWS_REGION: ${{ vars.AWS_REGION }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}

      - name: Construir la página
        run: |
          npm run build:site
          mkdir -p docs
          cp transparencia/index.html docs/index.html
          cp transparencia/*.ics docs/
          cp transparencia/*.xml docs/
          mkdir -p docs/datos
          cp transparencia/datos/* docs/datos/
          touch docs/.nojekyll

      - name: Commit y push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump docs
          pages_changed=false
          if git diff --cached --quiet; then
            echo "Sin cambios: ni ficheros nuevos ni página distinta."
          else
            git diff --cached --quiet -- docs || pages_changed=true
            n=$(git diff --cached --name-only -- dump | wc -l | tr -d ' ')
            git commit -m "datos: ${n} ficheros nuevos y página reconstruida ($(date -u +%F))"
            # Si main avanzó mientras tanto (p. ej. un push manual), se rebasa el commit y se reintenta.
            max=3
            for attempt in $(seq 1 "$max"); do
              if git push; then
                break
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "No se pudo hacer push en ${max} intentos."
                exit 1
              fi
              echo "Push fallido (intento ${attempt} de ${max}); se rebasa sobre origin/main y se reintenta."
              sleep $((attempt * ${RETRY_BASE_SECONDS:-60}))
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "No se pudo rebasar sobre origin/main."
                exit 1
              fi
            done
          fi
          echo "pages_changed=${pages_changed}" >> "$GITHUB_OUTPUT"

  # Los push hechos con el GITHUB_TOKEN no disparan otros workflows, así que el despliegue se invoca desde aquí.
  deploy:
    name: Publicar la página
    needs: update
    if: needs.update.outputs.pages_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
