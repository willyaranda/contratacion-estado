name: Probar envío de email

# Manual: manda un correo de prueba por SES con los secrets del repositorio. Los destinatarios salen de la variable
# TEST_TO (no se imprimen: los logs son públicos). Créala antes de lanzarlo y bórrala después.
on:
  workflow_dispatch:
    inputs:
      muestra:
        description: 'Enviar la muestra del aviso (HTML + texto, anuncios reales del dump) en vez del correo de prueba simple'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enviar correo de prueba
        run: node scripts/test-email.js
        env:
          MUESTRA: ${{ inputs.muestra }}
          TEST_TO: ${{ vars.TEST_TO }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
