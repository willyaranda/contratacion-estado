version: 2

updates:
  # Dependencias de npm (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      # Las herramientas de desarrollo se agrupan en un único PR para reducir ruido
      dev-tooling:
        dependency-type: development
      aws-sdk:
        patterns:
          - '@aws-sdk/*'

  # Acciones de GitHub usadas en .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    groups:
      github-actions:
        patterns:
          - '*'
