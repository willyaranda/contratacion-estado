  - contentinfo [ref=f11e2041]:
    - generic [ref=f11e2042]: "Fuente: Plataforma de Contratación del Sector Público (feeds de sindicación). Datos hasta el 16/10/2026 (último anuncio recibido). «Fecha» es la de adjudicación o, si no consta, la de última actualización del anuncio. «Importe» es el adjudicado con IVA; si el contrato aún no tiene importe adjudicado se muestra el presupuesto y no se suma en los totales. Si un contrato tiene varias versiones publicadas se usa la más reciente. El tiempo hasta la adjudicación se mide desde el cierre del plazo de ofertas y solo en licitaciones con ambas fechas. El «Resultado» (adjudicado, desierto, desistimiento, renuncia) sale del código de resultado de cada lote del anuncio. Las medias anuales incluyen años con menos datos (los contratos menores constan desde 2018), por lo que la comparación con los últimos 12 meses tiende a salir al alza. Herramienta de consulta no oficial: la referencia es siempre el anuncio original (enlace «Ver»)."